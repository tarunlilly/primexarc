# Alembic configuration for ARC's history DB.
#
# Run from app/backend/:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "<message>"
#
# Connection URL is set programmatically by env.py from config.settings —
# DO NOT put a real URL here. The line below is intentionally empty.

[alembic]
script_location = db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url =

# Always read the URL from env.py (which reads from config.settings).
# Hardcoding here would bypass the env-var pattern and risk leaking creds.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
