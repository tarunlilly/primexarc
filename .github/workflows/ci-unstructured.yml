name: CI — Unstructured (PrimeData)

on:
  push:
    branches: [main]
    paths: ['apps/unstructured/**']
  pull_request:
    paths: ['apps/unstructured/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unstructured/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/unstructured/backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
